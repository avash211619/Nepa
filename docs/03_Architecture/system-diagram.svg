<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <style>
    .box{fill:#f8fafc;stroke:#1f2937;stroke-width:1.5}
    .label{font:14px sans-serif;fill:#0f172a}
    .small{font:12px sans-serif;fill:#0f172a}
    .arrow{stroke:#0f172a;stroke-width:1.5;marker-end:url(#arrowhead)}
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0f172a" />
    </marker>
  </defs>
  <!-- Browser -->
  <rect x="40" y="40" width="200" height="80" rx="8" class="box" />
  <text x="70" y="80" class="label">Browser / Client</text>
  <text x="70" y="98" class="small">(WASM + UI)</text>

  <!-- Frontend -->
  <rect x="320" y="20" width="280" height="120" rx="8" class="box" />
  <text x="360" y="60" class="label">Next.js Frontend</text>
  <text x="360" y="80" class="small">SSR landing pages + tool UI</text>

  <!-- API -->
  <rect x="660" y="20" width="220" height="80" rx="8" class="box" />
  <text x="700" y="60" class="label">API / Route Handlers</text>

  <!-- Queue -->
  <rect x="940" y="20" width="180" height="80" rx="8" class="box" />
  <text x="960" y="60" class="label">Redis Queue</text>

  <!-- Workers -->
  <rect x="660" y="140" width="220" height="120" rx="8" class="box" />
  <text x="700" y="170" class="label">Image Workers</text>
  <text x="700" y="190" class="small">(sharp / libvips)</text>

  <!-- Storage -->
  <rect x="940" y="140" width="220" height="120" rx="8" class="box" />
  <text x="980" y="170" class="label">Object Store</text>
  <text x="980" y="190" class="small">(Cloudflare R2 / S3)</text>

  <!-- CDN -->
  <rect x="940" y="300" width="220" height="80" rx="8" class="box" />
  <text x="980" y="340" class="label">CDN (Cloudflare)</text>

  <!-- DB / Cache -->
  <rect x="660" y="300" width="220" height="80" rx="8" class="box" />
  <text x="700" y="340" class="label">Redis / Postgres</text>

  <!-- Observability -->
  <rect x="320" y="300" width="280" height="80" rx="8" class="box" />
  <text x="360" y="340" class="label">Observability</text>
  <text x="360" y="360" class="small">(Sentry, Prometheus)</text>

  <!-- Arrows -->
  <line x1="240" y1="80" x2="320" y2="80" class="arrow" />
  <line x1="600" y1="80" x2="660" y2="80" class="arrow" />
  <line x1="880" y1="80" x2="940" y2="80" class="arrow" />

  <line x1="770" y1="140" x2="770" y2="140" class="arrow" />
  <line x1="770" y1="260" x2="770" y2="300" class="arrow" />
  <line x1="820" y1="220" x2="940" y2="220" class="arrow" />

  <line x1="940" y1="260" x2="940" y2="300" class="arrow" />
  <line x1="780" y1="340" x2="940" y2="340" class="arrow" />

  <text x="40" y="140" class="small">User uploads / triggers</text>
</svg>
